<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pirate.io</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #070b12;
      }

      #game-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #070b12;
      }

      #game-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      #fullscreen-button {
        position: absolute;
        right: 14px;
        bottom: 14px;
        z-index: 2;
        border: 1px solid rgba(255, 216, 137, 0.4);
        border-radius: 7px;
        padding: 9px 12px;
        background: rgba(14, 10, 9, 0.82);
        color: #ffe0a2;
        cursor: pointer;
        font: 700 11px Arial, sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #fullscreen-button:hover {
        border-color: #f1a14b;
        background: rgba(73, 34, 17, 0.92);
      }

      #game-shell:fullscreen {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <main id="game-shell">
      <iframe
        id="game-frame"
        src="https://garrett2109.github.io/YoHoHo.ioserver-2/"
        title="Pirate.io"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
      ></iframe>
      <button id="fullscreen-button" type="button">Full screen</button>
    </main>

    <script>
      const gameShell = document.getElementById('game-shell');
      const button = document.getElementById('fullscreen-button');

      button.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await gameShell.requestFullscreen();
          }
        } catch {
          await document.getElementById('game-frame').requestFullscreen().catch(() => undefined);
        }
      });

      document.addEventListener('fullscreenchange', () => {
        button.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
      });
    </script>
  </body>
</html>
